# QuantumFlow 开发环境配置

app:
  name: "QuantumFlow"
  version: "1.0.0"
  environment: "development"
  log_level: "DEBUG"

api:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  timeout: 300
  cors_enabled: true
  cors_origins:
    - "*"
  rate_limit_enabled: false

scheduler:
  enabled: true
  loop_interval_ms: 100
  max_concurrent_requests: 100
  queue_max_size: 1000
  strategy_default: "adaptive"

cluster:
  heartbeat_interval_seconds: 5
  heartbeat_timeout_seconds: 30

inference:
  default_backend: "vllm"
  backends:
    vllm:
      default_tensor_parallel: 1
      default_gpu_memory_utilization: 0.9

storage:
  redis:
    host: "localhost"
    port: 6379
    db: 0

monitoring:
  enabled: true
  metrics_port: 9090

models:
  cache_dir: "~/.cache/huggingface"
