[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "quantumflow"
version = "1.0.0"
description = "分布式大模型推理平台"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "QuantumFlow Team", email = "team@quantumflow.ai"}
]
requires-python = ">=3.10"
keywords = ["ai", "llm", "inference", "distributed", "gpu", "vllm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.36.0",

    # 数据验证
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # 异步
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",

    # Redis
    "redis>=5.0.0",

    # gRPC
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "grpcio-reflection>=1.62.0",

    # 日志
    "structlog>=24.1.0",
    "python-json-logger>=2.0.0",

    # 监控
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",

    # 配置
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",

    # 推理引擎
    "vllm>=0.21.0",

    # 工具
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.0",
    "types-redis>=4.6.0",
    "types-protobuf>=4.25.0",
]

gpu = [
    "torch>=2.2.0",
    "nvidia-tensorrt>=10.0.0; platform_system=='Linux'",
    "flash-attn>=2.5.0; platform_system=='Linux'",
]

[project.scripts]
quantumflow = "quantumflow.cli:main"
qf-controller = "quantumflow.scripts.start_controller:main"
qf-worker = "quantumflow.scripts.start_worker:main"

[project.urls]
Homepage = "https://github.com/quantumflow/quantumflow"
Documentation = "https://quantumflow.ai/docs"
Repository = "https://github.com/quantumflow/quantumflow"
Issues = "https://github.com/quantumflow/quantumflow/issues"

[tool.poetry]
name = "quantumflow"
version = "1.0.0"
description = "分布式大模型推理平台"
authors = ["QuantumFlow Team"]

[tool.poetry.scripts]
quantumflow = "quantumflow.cli:main"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "ASYNC110",  # asyncio.sleep in while loop is an acceptable pattern
    "ASYNC210",  # blocking HTTP in async CLI code is acceptable
    "ASYNC240",  # os.path in async functions is acceptable
    "F811",  # function redefinition for CLI commands is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E712",   # == True/False comparisons are idiomatic in pytest asserts
    "E722",   # bare except in test scripts is acceptable
    "E741",   # ambiguous variable names in test scripts
    "E702",   # semicolons in quick scripts
    "B017",   # asserting Exception in tests is intentional
    "B007",   # unused loop variables in tests
    "B905",   # zip without strict= in test scripts
    "C408",   # unnecessary dict() calls in tests
    "C416",   # unnecessary list comprehensions in tests
    "E402",   # module level import not at top in test scripts
    "F841",   # unused variables in test scripts
    "ASYNC230",  # blocking open in async test scripts
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
implicit_optional = true
exclude = ["quantumflow/cli\\.py", "quantumflow/worker/worker\\.py"]

[[tool.mypy.overrides]]
module = "vllm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pynvml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "click.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["quantumflow"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*__pycache__*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
